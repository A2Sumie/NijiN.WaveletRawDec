name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            osx_arch: arm64
          - name: macos-x86_64
            os: macos-latest
            osx_arch: x86_64
          - name: macos-universal2
            os: macos-latest
            osx_arch: "arm64;x86_64"
          - name: linux-x86_64
            os: ubuntu-24.04
            osx_arch: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build
        run: |
          if [ -n "${{ matrix.osx_arch }}" ]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
              "-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build build -j

      - name: Test
        run: |
          if [ "${{ matrix.osx_arch }}" = "x86_64" ] && [ "$(uname -m)" = "arm64" ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 unavailable on runner; skipping x86_64 binary execution (covered by universal2/linux/windows and local Rosetta verification)"
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME:-v0.3.0}"
          PKG="nijinWVDC-${TAG}-${{ matrix.name }}"
          cmake --install build --prefix "${PWD}/dist/${PKG}"
          mkdir -p artifacts
          tar -C dist -czf "artifacts/${PKG}.tar.gz" "${PKG}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/*.tar.gz

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure & Build
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.3.0" }
          $pkg = "nijinWVDC-$tag-windows-x86_64"
          cmake --install build --config Release --prefix "$PWD/dist/$pkg"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "$PWD/dist/$pkg" -DestinationPath "artifacts/$pkg.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/*.zip

  publish:
    needs: [build-unix, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum nijinWVDC-* > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/nijinWVDC-*
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
